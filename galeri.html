     <div class="gallery">

    <!-- KOTAK TAMBAH -->

        <span>+</span>

        <input
            type="file"
            id="fileInput"
            accept="image/*"
            hidden
        >

    </label>


    <!-- DERETAN FOTO -->
    <div id="photo-list"></div>

</div>



    <p id="status"></p>

    <script src="galeri.js"></script>
 <script>

const nav=document.querySelector(".navbar");
const glass=document.querySelector(".nav-indicator");
const items=document.querySelectorAll(".nav-item");

function move(item){
    glass.style.left=item.offsetLeft+"px";
    glass.style.width=item.offsetWidth+"px";
}

items.forEach(item=>{
    item.addEventListener("click",e=>{

        items.forEach(i=>i.classList.remove("active"));
        item.classList.add("active");

        move(item);
    });
});

window.onload=()=>{
    move(document.querySelector(".active"));
};

</script>
